<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Lika Lidia Astutik</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav>
        <div class="container">

            <div class="logo">
                Lika<span>.</span>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html" class="active">Contact</a>
                </li>

            </ul>

        </div>
    </nav>


    <!-- ==================== CONTACT ==================== -->
    <main class="page-section">

        <div class="container">

            <h1>Hubungi Saya</h1>

            <div class="contact-box">

                <form>

                    <label for="nama">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama"
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email"
                    >


                    <label for="pesan">
                        Pesan
                    </label>

                    <textarea
                        id="pesan"
                        rows="6"
                        placeholder="Tulis pesan..."
                    ></textarea>


                    <button type="submit" class="btn">
                        Kirim Pesan
                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer>

        <p>
            © 2026 Lika Lidia Astutik
        </p>

        <p>
            Built with HTML • CSS • JavaScript
        </p>

    </footer>

</body>

</html>
