<!DOCTYPE html>
<html>
    <head>
        <title>Kalkulator Sederhana</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 400px;
                margin: 50px auto;
                padding: 20px;

                background-image: url("bg.jpg");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }

            .kalkulator {
                background: rgb(192, 201, 228);
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                text-align: center;
            }

            input {
                padding: 10px;
                margin: 5px;
                font-size: 16px;
                width: 80%;
                box-sizing: border-box;
            }

            button {
                padding: 10px 15px;
                margin: 5px;
                font-size: 16px;
                background: #f1eea3;
                color: black;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background: #f1eea3;
            }

            .hasil {
                font-size: 28px;
                font-weight: bold;
                color: #2c3e50;
                margin-top: 20px;
            }
        </style>
    </head>

    <body>

        <div class="kalkulator">
            <h2>Kalkulator</h2>

            <input type="number" id="angka1" placeholder="Masukkan Angka Pertama"><br>
            <input type="number" id="angka2" placeholder="Masukkan Angka Kedua"><br><br>

            <button onclick="tambah()">+</button>
            <button onclick="kurang()">-</button>
            <button onclick="kali()">&times;</button>
            <button onclick="bagi()">&divide;</button>
            <button onclick="reset()" style="background: #e74c3c;">Reset</button>

            <div class="hasil">
                Hasil: <span id="HasilAngka">0</span>
            </div>
        </div>

        <script>
            // penjelasan: document.getElementById digunakan untuk mengambil nilai dari tag HTML

            function tambah() {
                let a = parseFloat(document.getElementById('angka1').value);
                let b = parseFloat(document.getElementById('angka2').value);
                document.getElementById('HasilAngka').innerText = a + b;
            }

            function kurang() {
                let a = parseFloat(document.getElementById('angka1').value);
                let b = parseFloat(document.getElementById('angka2').value);
                document.getElementById('HasilAngka').innerText = a - b;
            }

            function kali() {
                let a = parseFloat(document.getElementById('angka1').value);
                let b = parseFloat(document.getElementById('angka2').value);
                document.getElementById('HasilAngka').innerText = a * b;
            }

            function bagi() {
                let a = parseFloat(document.getElementById('angka1').value);
                let b = parseFloat(document.getElementById('angka2').value);

                // Validasi pencegahan pembagian dengan angka 0
                if (b === 0) {
                    alert('Peringatan: Tidak bisa membagi angka dengan 0!');
                    return;
                }

                document.getElementById('HasilAngka').innerText = a / b;
            }

            function reset() {
                document.getElementById('angka1').value = "";
                document.getElementById('angka2').value = "";
                document.getElementById('HasilAngka').innerText = '0';
            }
        </script>

    </body>
</html>
